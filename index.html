<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>Sweet Crumbs Bakery</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- HEADER -->

    <section>
      <nav>
        <div class="logo">
          <img
            src="./assets-bakery/strawberry-cupcake.jpg"
            alt="sweet crumbs logo"
            class="logo__img"/>
          <h1 class="logo__text">
            <b>Sweet</b>
            Crumbs
          </h1>
        </div>

        <ul class="nav__links">
          <li><a href="#bakes" class="nav__link">Menu</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
          <li><a href="#contact" class="nav__link">Contact</a></li>
          <li>
            <a href="#order" class="nav__link nav__link--primary">Order Now</a>
          </li>
        </ul>
      </nav>

      <header>
        <div class="row">
          <div class="welcome">
            <figure class="welcome__img--wrapper">
              <img src="./assets-bakery/croissant.jpg" alt="fresh croissant" width="70" />
            </figure>

            <div class="welcome__description">
              <h1>Fresh-Batch Goodness, made at home!</h1>

              <p class="subheader">
                Small-Batch Breads, Cookies and Cupcakes baked with love
              </p>
              <a href="#bakes">
                <button class="welcome__description--btn">SEE OUR BAKES</button>
              </a>
            </div>
          </div>
        </div>
      </header>
    </section>


  </body>
</html>
